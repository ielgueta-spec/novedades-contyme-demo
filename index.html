<style>
/* Novedades Contyme · DEMO con datos ficticios.
   Este archivo es público (GitHub): no contiene datos reales, claves reales, correos reales ni URLs internas. */
:root {
  --bg: #F3F6F5; --card: #FFFFFF; --fg: #13201F; --muted: #52625F; --line: #D9E2E0; --line-fuerte: #9FB3AF;
  --brand: #0F4C47; --brand-fg: #FFFFFF; --brand-soft: #E3F1EE; --brand-ink: #0B5A54; --head-sub: #CDEAE5;
  --ok-bg: #DCF2E9; --ok-fg: #0E5E3F; --warn-bg: #FEF3C7; --warn-fg: #7A4A06; --crit-bg: #FDE8DD; --crit-fg: #9A3412;
  --info-bg: #E8EEFB; --info-fg: #1E3A8A; --admin: #1F2A37; --admin-sub: #C7D2DE; --sombra: 0 10px 30px rgba(15, 30, 28, .18);
  --display: "Outfit", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1615; --card: #16211F; --fg: #E6EFED; --muted: #9DB0AC; --line: #2A3A37; --line-fuerte: #4A605B;
  --brand: #0F4C47; --brand-fg: #FFFFFF; --brand-soft: #173A36; --brand-ink: #8FD6CB; --head-sub: #B7E0D9;
  --ok-bg: #133B2C; --ok-fg: #9BE3C3; --warn-bg: #3D2E0A; --warn-fg: #F8D57E; --crit-bg: #42200F; --crit-fg: #F9B38F;
  --info-bg: #1B2748; --info-fg: #B5C8F7; --admin: #1F2A37; --admin-sub: #C7D2DE; --sombra: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1615; --card: #16211F; --fg: #E6EFED; --muted: #9DB0AC; --line: #2A3A37; --line-fuerte: #4A605B;
  --brand: #0F4C47; --brand-fg: #FFFFFF; --brand-soft: #173A36; --brand-ink: #8FD6CB; --head-sub: #B7E0D9;
  --ok-bg: #133B2C; --ok-fg: #9BE3C3; --warn-bg: #3D2E0A; --warn-fg: #F8D57E; --crit-bg: #42200F; --crit-fg: #F9B38F;
  --info-bg: #1B2748; --info-fg: #B5C8F7; --admin: #1F2A37; --admin-sub: #C7D2DE; --sombra: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark }

html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
body.es-admin::before { background: var(--admin); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #F59E0B; outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
input::-ms-reveal, input::-ms-clear { display: none; }
svg { flex-shrink: 0; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
p { margin: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.saltar { position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--card); color: var(--fg); padding: 10px 14px; border-radius: 10px; font-weight: 700; }
.saltar:focus { top: 12px; }

/* Barra de demo: siempre visible para que nadie confunda la demo con un sistema seguro */
.demo-barra { background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 10px; padding-block: 6px; text-align: center; }
.demo-barra button { background: transparent; border: 0; color: inherit; text-decoration: underline; font-weight: 700; min-height: 32px; cursor: pointer; padding: 0 4px; }

/* Ingreso */
.login { min-height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }
.login-top { background: var(--brand); color: var(--brand-fg); padding-block: 36px 26px; display: flex; flex-direction: column; gap: 10px; }
.login-top h1 { font-size: 30px; font-weight: 700; }
.login-top p { color: var(--head-sub); }
.login-cuerpo { padding-block: 24px; display: flex; flex-direction: column; gap: 16px; }
.login-cuerpo h2 { font-size: 20px; }
.demo { background: var(--card); border: 1px dashed var(--line-fuerte); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.demo-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-fuerte); background: var(--bg); font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.pie-login { text-align: center; padding-bottom: 16px; }

/* App del cliente */
.app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.top { background: var(--brand); color: var(--brand-fg); padding-block: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--head-sub); }
.empresa { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.salir { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.45); background: transparent; color: inherit; font-weight: 600; font-size: 14px; cursor: pointer; flex-shrink: 0; }
.top h1 { font-size: 26px; font-weight: 700; }
.top p { color: var(--head-sub); font-size: 15px; }
.estado { background: rgba(255,255,255,.12); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; }
.plazo { font-size: 14px; color: var(--head-sub); display: flex; gap: 6px; align-items: center; }
main.cli { flex: 1; padding-block: 18px 28px; display: flex; flex-direction: column; gap: 14px; }
.fila-titulo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 12px; flex-wrap: wrap; }
.fila-titulo h2 { font-size: 19px; font-weight: 600; }
.sub { color: var(--muted); font-size: 14px; }
.centro { text-align: center; }

.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.p-ok { background: var(--ok-bg); color: var(--ok-fg); } .p-warn { background: var(--warn-bg); color: var(--warn-fg); }
.p-crit { background: var(--crit-bg); color: var(--crit-fg); } .p-info { background: var(--info-bg); color: var(--info-fg); }
.p-neutro { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.nov { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
.avatar { width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; display: grid; place-items: center; font-weight: 700; background: var(--brand-soft); color: var(--brand-ink); }
.nov-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.nov-txt > span { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.nov-tipo { font-weight: 700; color: var(--brand-ink) !important; }
.marcas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.adj { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--brand-ink); font-weight: 600; overflow-wrap: anywhere; }
.adj img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.nov-acc { display: flex; flex-direction: column; margin: -8px -8px 0 0; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; border-radius: 22px; cursor: pointer; flex-shrink: 0; }
.icon-btn:hover { background: var(--brand-soft); color: var(--brand-ink); }

.vacio { background: var(--card); border: 1px dashed var(--line-fuerte); border-radius: 14px; padding: 20px 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.btn { min-height: 50px; border-radius: 14px; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; width: 100%; padding: 0 16px; text-align: center; }
.btn-pri { background: var(--brand); color: var(--brand-fg); border: 1px solid var(--brand); }
.btn-sec { background: var(--card); color: var(--brand-ink); border: 1px solid var(--brand-ink); }
.btn-peligro { background: var(--crit-fg); color: var(--card); border: 1px solid var(--crit-fg); }
.btn-chico { min-height: 40px; width: auto; font-size: 14px; border-radius: 10px; padding: 0 12px; }
.btn-link { background: transparent; border: 0; color: var(--brand-ink); font-weight: 600; text-decoration: underline; min-height: 44px; cursor: pointer; padding: 0 6px; }
.btn-link.chico { font-size: 14px; color: var(--muted); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

.campo { display: flex; flex-direction: column; gap: 6px; }
.campo > label, legend { font-size: 15px; font-weight: 700; }
.campo input, .campo select, .campo textarea { min-height: 48px; border-radius: 12px; border: 1px solid var(--line-fuerte); background: var(--card); padding: 10px 12px; font-size: 16px; width: 100%; }
.campo input[aria-invalid="true"], .campo select[aria-invalid="true"], .campo textarea[aria-invalid="true"] { border: 2px solid var(--crit-fg); }
.err-campo { color: var(--crit-fg); font-size: 14px; font-weight: 700; display: flex; gap: 6px; align-items: flex-start; }
.err-campo::before { content: "!"; flex-shrink: 0; width: 18px; height: 18px; border-radius: 9px; background: var(--crit-fg); color: var(--card); font-size: 12px; display: grid; place-items: center; margin-top: 1px; }
.pass { position: relative; }
.pass input { padding-right: 92px; }
.pass .ver { position: absolute; right: 4px; top: 4px; bottom: 4px; min-width: 80px; border: 0; border-radius: 9px; background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; font-size: 14px; cursor: pointer; }
.dos-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.num { width: 24px; height: 24px; border-radius: 12px; background: var(--brand); color: var(--brand-fg); font-size: 13px; display: inline-grid; place-items: center; flex-shrink: 0; }
.tipos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 350px) { .tipos { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dos-col { grid-template-columns: 1fr; } }
.tipos button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line-fuerte); background: var(--card); font-weight: 600; font-size: 14px; cursor: pointer; padding: 4px; line-height: 1.2; }
.tipos button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.foto { position: relative; min-height: 64px; border-radius: 12px; border: 1px dashed var(--brand-ink); background: var(--card); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; color: var(--brand-ink); cursor: pointer; padding: 8px 12px; text-align: center; }
.foto:focus-within { outline: 3px solid #F59E0B; outline-offset: 2px; }
.foto input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.archivo-listo { display: flex; align-items: center; gap: 10px; background: var(--brand-soft); border-radius: 12px; padding: 8px 10px; color: var(--brand-ink); font-weight: 600; font-size: 14px; }
.archivo-listo img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; }
.archivo-listo span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.error { color: var(--crit-fg); background: var(--crit-bg); border-radius: 12px; padding: 10px 12px; font-size: 15px; font-weight: 600; }
.nota { border-radius: 12px; padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.nota-info { background: var(--info-bg); color: var(--info-fg); }
.nota-warn { background: var(--warn-bg); color: var(--warn-fg); }
.nota-crit { background: var(--crit-bg); color: var(--crit-fg); }
.contador { align-self: flex-end; font-size: 13px; color: var(--muted); }

.aviso-ok { background: var(--ok-bg); color: var(--ok-fg); border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
.pasos { list-style: none; margin: 0; padding: 0; }
.paso { display: flex; gap: 12px; }
.paso-marca { display: flex; flex-direction: column; align-items: center; }
.punto { width: 22px; height: 22px; border-radius: 11px; border: 2px solid var(--muted); background: var(--card); display: grid; place-items: center; color: var(--card); }
.paso.hecho .punto { background: var(--brand-ink); border-color: var(--brand-ink); }
.linea { width: 2px; flex: 1; min-height: 20px; background: var(--line); }
.paso.hecho .linea { background: var(--brand-ink); }
.paso-txt { padding-bottom: 14px; display: flex; flex-direction: column; }
.paso-txt span { color: var(--muted); font-size: 14px; }
.mes { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-height: 58px; padding: 6px 6px 6px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.tabs { position: sticky; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs button { position: relative; border: 0; background: transparent; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 10px; }
.tabs button[aria-current="page"] { color: var(--brand-ink); background: var(--brand-soft); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--crit-fg); color: var(--card); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); }

/* Administrador */
.adm-top { background: var(--admin); color: #FFFFFF; padding-block: 12px; }
.adm-top-in { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 12px; justify-content: space-between; align-items: center; }
.adm-marca { display: flex; flex-direction: column; min-width: 0; }
.adm-marca span:first-child { font-family: var(--display); font-weight: 700; font-size: 20px; }
.adm-marca span:last-child { font-size: 13px; color: var(--admin-sub); overflow-wrap: anywhere; }
.adm-nav { display: flex; gap: 4px; flex-wrap: wrap; order: 3; width: 100%; }
@media (min-width: 900px) { .adm-nav { order: 0; width: auto; } }
.adm-nav button { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: var(--admin-sub); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.adm-nav button[aria-current="page"] { background: #FFFFFF; color: var(--admin); }
.adm-main { max-width: 1200px; width: 100%; margin: 0 auto; padding-block: 22px 40px; display: flex; flex-direction: column; gap: 18px; }
.resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.dato { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer; min-height: 72px; }
.dato b { font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }
.dato[aria-pressed="true"] { border: 2px solid var(--brand-ink); background: var(--brand-soft); }
.barra-herr { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.barra-herr .campo { flex: 1 1 240px; }
.dos { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.dos > .ancho { flex: 999 1 520px; min-width: 0; }
.dos > .angosto { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.caja { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.caja h3 { font-size: 17px; }
.tabla-caja { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
caption { text-align: left; padding: 12px 12px 0; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.sel td { background: var(--brand-soft); }
.fila-btn { border: 0; background: transparent; padding: 0; text-align: left; font-weight: 700; cursor: pointer; color: var(--fg); min-height: 36px; text-decoration: underline; text-decoration-color: var(--line-fuerte); text-underline-offset: 3px; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; }
.acciones .btn { flex: 1 1 160px; width: auto; font-size: 15px; }
.mono { font-variant-numeric: tabular-nums; }
.resultado { border-radius: 12px; padding: 12px; font-size: 14px; background: var(--brand-soft); color: var(--fg); display: flex; flex-direction: column; gap: 8px; }
.resultado ul { margin: 0; padding-left: 18px; }
.resultado .malos { color: var(--crit-fg); }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.seg button { min-height: 48px; border-radius: 12px; border: 1px solid var(--line-fuerte); background: var(--card); font-weight: 700; cursor: pointer; padding: 6px 10px; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
.compara { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.compara ul { margin: 6px 0 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.actividad li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.actividad li:last-child { border-bottom: 0; }
.actividad time { font-size: 13px; color: var(--muted); white-space: nowrap; min-width: 92px; font-variant-numeric: tabular-nums; }
.link-demo { font-family: ui-monospace, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; background: var(--bg); border-radius: 8px; padding: 6px 8px; }
@media (max-width: 720px) {
  .tabla-resp thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .tabla-resp, .tabla-resp tbody, .tabla-resp tr, .tabla-resp td { display: block; width: 100%; }
  .tabla-resp tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .tabla-resp tr:last-child { border-bottom: 0; }
  .tabla-resp td { border: 0; padding: 4px 14px; }
  .tabla-resp td[data-l]::before { content: attr(data-l); display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
}

/* Diálogo y aviso flotante */
dialog { border: 0; border-radius: 16px; padding: 0; background: var(--card); color: var(--fg); width: min(460px, calc(100% - 32px)); box-shadow: var(--sombra); }
dialog::backdrop { background: rgba(10, 20, 19, .55); }
.dlg-in { padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 80vh; overflow-y: auto; }
.dlg-in h2 { font-size: 20px; }
.dlg-in ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

<script>
(() => {
'use strict';
/* =============================================================================
   NOVEDADES CONTYME · DEMO
   Todo este archivo es PÚBLICO (va a GitHub). Por eso:
   - Solo datos ficticios: RUT 99.xxx.xxx, personas inventadas, correos *.demo.
   - Ninguna clave real, ningún correo real, ninguna URL interna, ningún secreto.

   ============================================================================= */
const CONFIG = {

  servidor: '',
  demo: false,               // true: muestra ayudas de prueba (chips, claves de demo, reinicio)
  periodo: { id: '2026-11', nombre: 'Noviembre 2026', mes: 'noviembre', plazo: '2026-11-25' },
  // PENDIENTE DE DECISIÓN (Contyme): 'clave-inicial' (clave genérica) o 'link' (link de un solo uso).
  // En la demo se puede cambiar en Administración → Ajustes para probar las dos.

  admin: 'administrador',
  semillas: {}                        // sin empresas de prueba
};
/* Correos con acceso de administrador. Se guarda solo su huella SHA-256 (con el prefijo «novedades-admin|»), así los
   correos no quedan escritos en este código público. Para agregar uno: sha256('novedades-admin|' + correo en minúsculas). */
const ADMINS = [
  '9f3f2ae42c37ebd1368fed2355d5bf0a58dfcae40e0b3b39fec3941c153721f1',
  '7f61ae9a61d95c089a7e7e57053110921bda30c4d9f29eafb98fbd25f4f4ff76'

  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('novedades-admin|' + String(correo).trim().toLowerCase()));
  return ADMINS.includes(aHex(new Uint8Array(b)));
}
const REMOTO = !!CONFIG.servidor;
const SIM = REMOTO ? '' : ' (simulado)';
/* Llama al servidor. Content-Type text/plain para que el navegador no haga la consulta previa (CORS) que Apps Script no responde. */
async function api(accion, datos) {

    const j = await r.json();
    if (j && j.salir && sesion) { cerrarSesion(j.error || 'Tu sesión venció. Vuelve a entrar.'); }
    return j || { error: 'Respuesta vacía del servidor.' };

const archivosMem = new Map(); // id de novedad → archivo (para subirlo al enviar)
function aBase64(f) { return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = mal; r.readAsDataURL(f); }); }
/* Copia en este dispositivo lo que el servidor dice de la empresa (y conserva el borrador si no ha enviado). */
function cargarCliente(d) {
  if (!d) return;

  s.remutyme[d.rut] = { nombre: d.nombre, cartera: '', correoRrhh: '', trabajadores: Array.from(new Set((d.trabajadores || []).concat(previo ? previo.trabajadores : []))) };

  const local = s.meses[d.rut] || { novedades: [], sinNovedades: false, enviado: null, revisado: false, ingresado: false, nota: null };
  const m = d.mes || {};

  else s.meses[d.rut] = Object.assign(local, { enviado: null, revisado: false, ingresado: false, nota: m.nota || local.nota || null });

}
async function cargarAdmin() {
  const r = await api('adm-datos');

    s.cuentas[e.rut] = Object.assign(cuentaNueva(), { habilitada: e.habilitada, hash: e.registrada ? 'servidor' : null, correo: e.contacto, intentos: e.intentos, pideReset: e.pideReset });
    const m = r.meses[e.rut];
    s.meses[e.rut] = m && m.enviado ? { novedades: m.novedades.map((n, i) => Object.assign({ id: e.rut + '-' + i }, n)), sinNovedades: m.sinNovedades, enviado: m.enviado, revisado: m.revisado, ingresado: m.ingresado, nota: null, carpeta: m.carpeta }

  });

}
/* Acción de administrador en el servidor; después vuelve a leer todo para quedar igual que el servidor. */
function remoto(accion, datos) {
  if (!REMOTO) return;
  api(accion, datos).then(r => { if (r.error) toast(r.error); return cargarAdmin(); }).then(() => { if (sesion) pintar(); });
}
const LS = 'novedades-contyme-v5';
const SS = 'novedades-contyme-sesion-v5';
const LS_TEMA = 'novedades-contyme-tema';

const TIPOS = {
  'Horas extra': { campos: [{ id: 'horas', l: 'Cantidad de horas', t: 'num', ej: 'Ej. 6', min: 0.5, max: 120, ayuda: 'Puedes usar medias horas, por ejemplo 2,5.' }] },
  'Bono': { campos: [{ id: 'monto', l: 'Monto en pesos', t: 'monto', ej: 'Ej. 50.000' }, { id: 'motivo', l: 'Motivo del bono', t: 'txt', ej: 'Ej. producción de octubre' }] },
  'Licencia médica': { campos: [{ id: 'desde', l: 'Desde', t: 'fecha' }, { id: 'hasta', l: 'Hasta', t: 'fecha' }], adj: 'Saca una foto a la licencia o sube el PDF', importante: true },
  'Vacaciones': { campos: [{ id: 'desde', l: 'Desde', t: 'fecha' }, { id: 'hasta', l: 'Hasta', t: 'fecha' }], adj: 'Comprobante firmado (si lo tienes)' },
  'Ausencia': { campos: [{ id: 'dias', l: 'Cantidad de días', t: 'num', ej: 'Ej. 1', min: 0.5, max: 31 }, { id: 'motivo', l: 'Motivo', t: 'opc', ops: ['Permiso sin goce de sueldo', 'Permiso con goce de sueldo', 'Falta sin aviso', 'Otro'] }] },
  'Anticipo': { campos: [{ id: 'monto', l: 'Monto en pesos', t: 'monto', ej: 'Ej. 100.000' }] },
  'Ingreso': { sinTrabajador: true, campos: [{ id: 'nombre', l: 'Nombre completo', t: 'txt', ej: 'Ej. Ana Soto Rivas' }, { id: 'rut', l: 'RUT del trabajador', t: 'rut', ej: 'Con guion y dígito verificador' }, { id: 'fecha', l: 'Fecha de ingreso', t: 'fecha' }, { id: 'cargo', l: 'Cargo', t: 'txt', ej: 'Ej. vendedora' }], adj: 'Foto del carnet por ambos lados', importante: true },
  'Término': { campos: [{ id: 'fecha', l: 'Último día de trabajo', t: 'fecha' }, { id: 'causal', l: 'Motivo', t: 'opc', ops: ['Renuncia', 'Mutuo acuerdo', 'Vencimiento del plazo', 'Necesidades de la empresa', 'Otro'] }], adj: 'Carta de renuncia o aviso de término' },
  'Otro': { campos: [{ id: 'detalle', l: 'Cuéntanos qué pasó', t: 'txt', ej: 'Ej. cambio de jornada desde el lunes 17' }] }
};

/* ---------- Datos de partida (100 % ficticios) ---------- */
function semilla() {
  const mesVacio = () => ({ novedades: [], sinNovedades: false, enviado: null, revisado: false, ingresado: false, nota: null });
  return {
    v: 4,
    ajustes: { activacion: CONFIG.activacion },
    /* Empresas (las crea Contyme en «Habilitar empresas»), cuentas de la app y novedades: todo parte en cero. */
    remutyme: {},
    cuentas: {},
    meses: {},
    actividad: [],
    recordados: {},
    siguienteId: 1
  };
}
function cuentaNueva() { return { habilitada: true, hash: null, sal: null, correo: '', intentos: 0, pideReset: false, link: null }; }

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const copia = x => JSON.parse(JSON.stringify(x));
const ahora = () => new Date().toISOString();
function leerLS(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function escribirLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function normRut(t) { const x = String(t || '').replace(/[^0-9kK]/g, '').toUpperCase().replace(/^0+/, ''); return x.length > 1 && /^\d+$/.test(x.slice(0, -1)) ? x.slice(0, -1) + '-' + x.slice(-1) : ''; }
function rutBonito(r) { const p = String(r).split('-'); return p.length === 2 ? Number(p[0]).toLocaleString('es-CL') + '-' + p[1] : String(r); }
function dvValido(r) {
  const p = String(r).split('-'); if (p.length !== 2 || !/^\d{6,9}$/.test(p[0])) return false;
  let suma = 0, m = 2; for (let i = p[0].length - 1; i >= 0; i--) { suma += Number(p[0][i]) * m; m = m === 7 ? 2 : m + 1; }
  const dv = 11 - (suma % 11); return (dv === 11 ? '0' : dv === 10 ? 'K' : String(dv)) === p[1];
}
const RE_CORREO = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function dLocal(iso) { const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
const fmtDia = d => d.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtCorta = iso => dLocal(iso).toLocaleDateString('es-CL', { day: 'numeric', month: 'short' }).replace('.', '');
const fmtHora = iso => new Date(iso).toLocaleString('es-CL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtNum = n => Number(n).toLocaleString('es-CL', { maximumFractionDigits: 1 });
const clp = n => '$' + Number(n).toLocaleString('es-CL');
const diasEntre = (a, b) => Math.round((dLocal(b) - dLocal(a)) / 864e5) + 1;
const plural = (n, uno, varios) => n === 1 ? '1 ' + uno : n + ' ' + varios;
function aHex(a) { return Array.from(a, x => x.toString(16).padStart(2, '0')).join(''); }
function azarHex(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return aHex(a); }
async function huella(clave, salHex) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveBits']);
  const sal = new Uint8Array(salHex.match(/../g).map(h => parseInt(h, 16)));
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: 150000 }, base, 256);
  return aHex(new Uint8Array(bits));
}
const espera = ms => new Promise(r => setTimeout(r, ms));

function detalle(n) {
  const d = n.datos || {};
  switch (n.tipo) {
    case 'Horas extra': return fmtNum(d.horas) + (d.horas === 1 ? ' hora' : ' horas');
    case 'Bono': return clp(d.monto) + ' · ' + d.motivo;
    case 'Licencia médica': case 'Vacaciones': return fmtCorta(d.desde) + ' al ' + fmtCorta(d.hasta) + ' (' + plural(diasEntre(d.desde, d.hasta), 'día', 'días') + ')';
    case 'Ausencia': return fmtNum(d.dias) + (d.dias === 1 ? ' día' : ' días') + ' · ' + d.motivo;
    case 'Anticipo': return clp(d.monto);
    case 'Ingreso': return 'RUT ' + rutBonito(d.rut) + ' · desde el ' + fmtCorta(d.fecha) + ' · ' + d.cargo;
    case 'Término': return 'Último día ' + fmtCorta(d.fecha) + ' · ' + d.causal;
    default: return d.detalle || '';
  }

/* ---------- Estado ---------- */
let s = leerLS(LS);
if (!s || s.v !== 4) s = semilla();
const guardar = () => { if (!escribirLS(LS, s)) toast('No se pudo guardar en este navegador. La demo funciona, pero se perderá al recargar.'); };

function modo() { return REMOTO ? 'clave-inicial' : s.ajustes.activacion; }

/* Convierte las claves ficticias de las empresas de prueba en huellas (una vez). */
async function prepararSemillas() {
  for (const rut of Object.keys(DEMO.semillas)) {
    const c = s.cuentas[rut];
    if (c && !c.hash && !c.semillaLista) { c.sal = azarHex(16); c.hash = await huella(DEMO.semillas[rut], c.sal); c.semillaLista = true; }

  guardar();
}
let listo = Promise.resolve();

let sesion = null;
try { sesion = JSON.parse(sessionStorage.getItem(SS)); } catch (e) { sesion = null; }

/* Archivos: solo en memoria de esta pestaña. Nunca a localStorage (son datos personales). */
const previas = new Map();
const tickets = new Map();

/* =============================================================================
   srv — CONTRATO DEL SERVIDOR (simulado).
   En Remutyme cada función será un endpoint con sesión real; aquí corre en el
   navegador. La interfaz solo usa lo que estas funciones devuelven, así la vista
   del cliente nunca recibe datos de otra empresa.

const GENERICO = 'El RUT o la clave no son correctos. Si tu empresa todavía no usa la app, pídele a tu encargada de remuneraciones en Contyme que la habilite.';
const BLOQUEO = 'Por seguridad, el acceso quedó bloqueado tras ' + CONFIG.maxIntentos + ' intentos fallidos. Pídele a tu encargada en Contyme que restablezca la clave.';
function nuevoTicket(rut, link) { const t = azarHex(16); tickets.set(t, { rut, link: link || null, vence: Date.now() + 10 * 60e3 }); return t; }
function crearLink(rut) {
  const c = s.cuentas[rut], e = s.remutyme[rut];
  c.link = { token: azarHex(16), vence: new Date(Date.now() + CONFIG.horasLink * 3600e3).toISOString() };
  registrar(rut, 'correo', 'Correo a RRHH de ' + e.nombre + ' (' + e.correoRrhh + '): link de un solo uso para crear la clave; vence en ' + CONFIG.horasLink + ' h.');

function soyAdmin() { if (!sesion || sesion.rol !== 'admin') throw new Error('Se requiere sesión de administrador'); }

const srv = {
  /* --- Acceso de empresas (públicos) --- */
  async ingresar(rutTxt, clave) {
    await listo;
    if (REMOTO) {
      const r = await api('ingresar', { rut: rutTxt, clave });
      if (r.ok) { cargarCliente(r.datos); return { ok: true, rut: r.rut, token: r.token }; }

    if (!c || !s.remutyme[rut]) return { campo: 'clave', error: GENERICO };
    if (!c.habilitada) return { error: 'El acceso de esta empresa está bloqueado. Habla con tu encargada de remuneraciones en Contyme.' };
    if (c.intentos >= CONFIG.maxIntentos) return { error: BLOQUEO };
    const fallo = () => {
      c.intentos++;
      if (c.intentos >= CONFIG.maxIntentos) { registrar(rut, 'seguridad', s.remutyme[rut].nombre + ': acceso bloqueado por ' + CONFIG.maxIntentos + ' intentos fallidos.'); guardar(); return { error: BLOQUEO }; }
      guardar(); const quedan = CONFIG.maxIntentos - c.intentos;
      return { campo: 'clave', error: GENERICO + (quedan <= 2 ? ' Te quedan ' + plural(quedan, 'intento', 'intentos') + '.' : '') };
    };
    if (!c.hash) {
      if (modo() !== 'clave-inicial' || clave !== DEMO.claveInicial) return fallo();
      c.intentos = 0; guardar();
      return { paso: 'crear', ticket: nuevoTicket(rut), nombre: s.remutyme[rut].nombre, rut };
    }
    if (await huella(clave, c.sal) !== c.hash) return fallo();
    c.intentos = 0; guardar();
    return { ok: true, rut };
  },
  abrirLink(token) {
    const rut = Object.keys(s.cuentas).find(r => s.cuentas[r].link && s.cuentas[r].link.token === token);
    if (!rut) return { error: 'Este link ya se usó o no es válido. Pídele uno nuevo a tu encargada en Contyme.' };
    const c = s.cuentas[rut];
    if (new Date(c.link.vence) < new Date()) return { error: 'Este link venció. Pídele uno nuevo a tu encargada en Contyme.' };
    if (!c.habilitada) return { error: 'El acceso de esta empresa está bloqueado. Habla con tu encargada de remuneraciones en Contyme.' };
    return { ticket: nuevoTicket(rut, token), nombre: s.remutyme[rut].nombre, rut };
  },
  async crearClave(ticket, nueva, repite, correo) {
    const t = tickets.get(ticket);
    if (!t || t.vence < Date.now()) return { error: 'Pasó mucho rato. Vuelve a empezar el ingreso.', reiniciar: true };
    if (t.remoto) {
      if (nueva !== repite) return { campo: 'repite', error: 'Las dos claves no son iguales.' };
      const r = await api('crear-clave', { ticket, nueva, correo });
      if (r.ok) { tickets.delete(ticket); cargarCliente(r.datos); return { ok: true, rut: r.rut, token: r.token }; }
      return r;
    }
    const rut = t.rut, c = s.cuentas[rut], nom = s.remutyme[rut].nombre;
    const debil = [DEMO.claveInicial, 'contyme', '12345678', 'password', 'qwerty', rut.split('-')[0]].map(x => x.toLowerCase());
    if (nueva.length < CONFIG.claveMin) return { campo: 'nueva', error: 'La clave debe tener al menos ' + CONFIG.claveMin + ' caracteres.' };
    if (!/[0-9]/.test(nueva) || !/[a-zA-ZñÑ]/.test(nueva)) return { campo: 'nueva', error: 'Usa letras y números.' };
    if (debil.some(x => nueva.toLowerCase().includes(x))) return { campo: 'nueva', error: 'Es muy fácil de adivinar (no uses la clave inicial, el RUT ni "contyme"). Elige otra.' };
    if (nueva !== repite) return { campo: 'repite', error: 'Las dos claves no son iguales.' };
    correo = String(correo || '').trim().toLowerCase();
    if (!RE_CORREO.test(correo)) return { campo: 'contacto', error: 'Escribe un correo de contacto válido, por ejemplo nombre@tuempresa.cl.' };
    c.sal = azarHex(16); c.hash = await huella(nueva, c.sal); c.correo = correo; c.intentos = 0; c.pideReset = false; c.link = null;
    tickets.delete(ticket);
    registrar(rut, 'seguridad', nom + ' creó su clave' + (t.link ? ' con el link de un solo uso' : ' (venía de la clave inicial)') + '.');
    guardar();
    return { ok: true, rut };
  },
  pedirRestablecer(rutTxt) {
    const rut = normRut(rutTxt);
    if (!rut || !dvValido(rut)) return { campo: 'o-rut', error: 'Revisa el RUT: falta un número o el dígito verificador no calza.' };
    if (REMOTO) { api('pedir-restablecer', { rut }); return { ok: true }; }
    const c = s.cuentas[rut];
    if (c && s.remutyme[rut] && !c.pideReset) { c.pideReset = true; registrar(rut, 'correo', 'Aviso a la encargada de ' + s.remutyme[rut].cartera + ': ' + s.remutyme[rut].nombre + ' pidió restablecer su clave.'); guardar(); }
    /* Misma respuesta siempre: no revela si el RUT es cliente de Contyme. */
    return { ok: true };
  },

  /* --- Cliente (requiere sesión de cliente; solo su empresa) --- */
  cli: {
    datos() {
      const rut = soyCliente(), e = s.remutyme[rut];
      return { rut, nombre: e.nombre, trabajadores: e.trabajadores.slice(), mes: copia(s.meses[rut]), correo: s.cuentas[rut].correo };
    },
    guardarNovedad(n, idEditar) {
      const rut = soyCliente(), m = s.meses[rut];
      if (m.enviado) return { error: 'Ya enviaste este mes. Si te faltó algo, escríbele a tu encargada.' };
      if (!TIPOS[n.tipo]) return { error: 'Tipo de novedad no válido.' };
      const lista = s.remutyme[rut].trabajadores;
      const nuevo = !!TIPOS[n.tipo].sinTrabajador || !lista.includes(n.trabajador);
      const limpia = { trabajador: String(n.trabajador).slice(0, 120), tipo: n.tipo, datos: n.datos, comentario: String(n.comentario || '').slice(0, 500), adjunto: n.adjunto, trabajadorNuevo: nuevo && !TIPOS[n.tipo].sinTrabajador, ejemplo: false };
      if (idEditar) {
        const i = m.novedades.findIndex(x => x.id === idEditar); if (i < 0) return { error: 'Esa novedad ya no existe.' };
        m.novedades[i] = Object.assign({ id: idEditar, creada: m.novedades[i].creada }, limpia, { editada: ahora() });
        guardar(); return { ok: true, id: idEditar };
      }
      const id = s.siguienteId++;
      if (limpia.trabajadorNuevo && limpia.trabajador && !lista.includes(limpia.trabajador)) lista.push(limpia.trabajador);
      m.novedades.push(Object.assign({ id, creada: ahora() }, limpia)); m.sinNovedades = false;
      guardar(); return { ok: true, id };
    },
    quitar(id) {
      const m = s.meses[soyCliente()]; if (m.enviado) return null;
      const i = m.novedades.findIndex(x => x.id === id); if (i < 0) return null;
      const [n] = m.novedades.splice(i, 1); guardar(); return { n, i };
    },
    restaurar(n, i) { const m = s.meses[soyCliente()]; if (m.enviado) return; m.novedades.splice(Math.min(i, m.novedades.length), 0, n); m.sinNovedades = false; guardar(); },
    sinNovedades(v) { const m = s.meses[soyCliente()]; if (m.enviado || m.novedades.length) return; m.sinNovedades = v; guardar(); },
    async enviar() {
      const rut = soyCliente(), m = s.meses[rut], e = s.remutyme[rut], c = s.cuentas[rut];
      if (m.enviado) return { error: 'Ya estaba enviado.' };
      if (!m.novedades.length && !m.sinNovedades) return { error: 'Agrega una novedad o marca que no hubo novedades.' };
      if (REMOTO) {
        const sinArchivo = m.novedades.filter(n => n.adjunto && !archivosMem.has(n.id));
        if (sinArchivo.length) return { error: 'Vuelve a adjuntar el respaldo de ' + sinArchivo.map(n => n.trabajador).join(', ') + ' (se pierde al cerrar la app). Toca la novedad → Editar.' };
        const archivos = [];
        for (let i = 0; i < m.novedades.length; i++) {
          const f = archivosMem.get(m.novedades[i].id);
          if (f) archivos.push({ idx: i, nombre: m.novedades[i].adjunto.nombre, mime: m.novedades[i].adjunto.mime, base64: await aBase64(f) });
        }
        const lista = m.novedades.map(n => ({ trabajador: n.trabajador, tipo: n.tipo, detalle: detalle(n), comentario: n.comentario, datos: n.datos, adjunto: n.adjunto ? { nombre: n.adjunto.nombre } : null, trabajadorNuevo: !!n.trabajadorNuevo }));
        const r = await api('enviar', { novedades: lista, sinNovedades: !!m.sinNovedades, archivos });
        if (r.error) return r;
        archivosMem.clear(); cargarCliente(r.datos); return { ok: true };
      }
      m.enviado = ahora(); m.revisado = false; m.ingresado = false; m.nota = null;
      const cuantas = m.novedades.length ? plural(m.novedades.length, 'novedad', 'novedades') : 'sin novedades';
      registrar(rut, 'accion', e.nombre + ' envió ' + cuantas + ' de ' + CONFIG.periodo.mes + ' a la bandeja de RRHH.');
      registrar(rut, 'correo', 'Aviso a la encargada de ' + e.cartera + ': «' + e.nombre + ' envió ' + cuantas + '». (El correo no lleva las novedades: solo avisa.)');
      if (c.correo) registrar(rut, 'correo', 'Confirmación al cliente (' + c.correo + '): «Recibimos tus novedades de ' + CONFIG.periodo.mes + '».');
      guardar(); return { ok: true };
    }
  },

  /* --- Administración (requiere sesión de Contyme) --- */
  adm: {
    empresas() { soyAdmin(); return Object.keys(s.cuentas).filter(r => s.remutyme[r]); },
    recordar(rut) {
      soyAdmin(); const m = s.meses[rut]; if (!m || m.enviado) return;
      remoto('adm-recordar', { rut, plazo: fmtCorta(CONFIG.periodo.plazo) });
      s.recordados[rut] = ahora();
      registrar(rut, 'correo', 'Recordatorio a ' + s.remutyme[rut].nombre + ' (' + (s.cuentas[rut].correo || s.remutyme[rut].correoRrhh) + '): «Recuerda enviar tus novedades de ' + CONFIG.periodo.mes + ' antes del ' + fmtCorta(CONFIG.periodo.plazo) + '».');
      guardar();
    },
    marcar(rut, estado) {
      soyAdmin(); const m = s.meses[rut]; if (!m || !m.enviado) return;
      remoto('adm-marcar', { rut, estado });
      if (estado === 'revisada') { m.revisado = true; m.ingresado = false; }
      else if (estado === 'ingresada') { m.revisado = true; m.ingresado = true; }
      else { m.revisado = false; m.ingresado = false; }
      registrar(rut, 'accion', s.remutyme[rut].nombre + ': marcada «' + (estado === 'por-revisar' ? 'Por revisar' : estado === 'revisada' ? 'Revisada' : 'Ingresada') + '».');
      guardar();
    },
    reabrir(rut, nota) {
      soyAdmin(); const m = s.meses[rut]; if (!m || !m.enviado) return;
      remoto('adm-reabrir', { rut, nota });
      m.enviado = null; m.revisado = false; m.ingresado = false; m.nota = nota;
      registrar(rut, 'correo', 'A ' + s.remutyme[rut].nombre + ': «Contyme te pidió revisar tus novedades: ' + nota + '».');
      guardar();
    },
    restablecer(rut) {
      soyAdmin(); const c = s.cuentas[rut]; if (!c) return;
      remoto('adm-restablecer', { rut });
      c.hash = null; c.sal = null; c.intentos = 0; c.pideReset = false; c.link = null;
      registrar(rut, 'seguridad', s.remutyme[rut].nombre + ': clave restablecida por Contyme.');
      if (modo() === 'link') crearLink(rut);
      guardar();
    },
    enviarLink(rut) { soyAdmin(); const c = s.cuentas[rut]; if (!c || c.hash) return; crearLink(rut); guardar(); },
    alternarBloqueo(rut) {
      soyAdmin(); const c = s.cuentas[rut]; c.habilitada = !c.habilitada;
      remoto('adm-bloqueo', { rut, habilitada: c.habilitada });
      registrar(rut, 'seguridad', s.remutyme[rut].nombre + ': acceso ' + (c.habilitada ? 'habilitado' : 'bloqueado') + ' por Contyme.');
      guardar(); return c.habilitada;
    },
    analizarCarga(texto) {
      soyAdmin();
      const r = { nuevas: [], ya: [], malos: [] }, vistos = new Set();
      String(texto).split(/\r?\n/).forEach((linea, i) => {
        if (!linea.trim()) return;
        const celdas = linea.split(/[;,\t]/).map(x => x.trim().replace(/^"|"$/g, ''));
        const celda = celdas.find(x => /\d/.test(x));
        if (!celda) { if (i > 0) r.malos.push('Línea ' + (i + 1) + ': no tiene un RUT.'); return; } // la primera puede ser encabezado
        const rut = normRut(celda);
        if (!rut || !dvValido(rut)) { r.malos.push('Línea ' + (i + 1) + ': «' + celda.slice(0, 30) + '» no es un RUT válido.'); return; }
        if (vistos.has(rut)) { r.repetidos = (r.repetidos || 0) + 1; return; } vistos.add(rut);
        if (!s.remutyme[rut]) {
          const nombre = celdas.find(x => x && x !== celda && /[a-záéíóúñ]/i.test(x) && !RE_CORREO.test(x));
          const correoRrhh = (celdas.find(x => RE_CORREO.test(x)) || '').toLowerCase();
          if (!nombre) { r.malos.push('Línea ' + (i + 1) + ': ' + rutBonito(rut) + ' es nueva y falta el nombre de la empresa (RUT; nombre).'); return; }
          r.datos = r.datos || {}; r.datos[rut] = { nombre: nombre.slice(0, 120), correoRrhh };
          r.nuevas.push(rut); return;
        }
        const c = s.cuentas[rut];
        if (c && c.habilitada) r.ya.push(rut); else r.nuevas.push(rut);
      });
      return r;
    },
    aplicarCarga(ruts, datos) {
      soyAdmin(); let n = 0;
      remoto('adm-habilitar', { empresas: ruts.map(rut => s.remutyme[rut] ? { rut, nombre: s.remutyme[rut].nombre } : { rut, nombre: datos[rut].nombre, correo: datos[rut].correoRrhh }) });
      ruts.forEach(rut => {
        if (!s.remutyme[rut] && datos && datos[rut]) s.remutyme[rut] = { nombre: datos[rut].nombre, cartera: 'Sin cartera', correoRrhh: datos[rut].correoRrhh, trabajadores: [] };
        if (!s.remutyme[rut]) return;
        if (s.cuentas[rut]) s.cuentas[rut].habilitada = true; else s.cuentas[rut] = cuentaNueva();
        if (!s.meses[rut]) s.meses[rut] = { novedades: [], sinNovedades: false, enviado: null, revisado: false, ingresado: false, nota: null };
        registrar(rut, 'seguridad', s.remutyme[rut].nombre + ': habilitada en la app (carga masiva).');
        if (modo() === 'link' && !s.cuentas[rut].hash) crearLink(rut);
        n++;
      });
      guardar(); return n;
    },
    cambiarActivacion(v) { soyAdmin(); if (v === 'clave-inicial' || v === 'link') { s.ajustes.activacion = v; registrar(null, 'accion', 'Demo: forma de activación cambiada a «' + (v === 'link' ? 'link de un solo uso' : 'clave inicial genérica') + '».'); guardar(); } }
  }
};

/* ---------- Pintar ---------- */
function validarSesion() {
  if (!sesion) return;
  if (sesion.rol === 'cliente') {
    const c = s.cuentas[sesion.rut];
    if (!c || !c.habilitada || !c.hash || c.intentos >= CONFIG.maxIntentos || !s.remutyme[sesion.rut]) cerrarSesion('Tu sesión se cerró porque cambió el acceso de la empresa.', true);
  } else if (sesion.rol !== 'admin') cerrarSesion('', true);
}
function claveFoco(el) {
  if (!el || el === document.body || !el.closest || !el.closest('#raiz')) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  const a = el.getAttribute('data-a'); if (!a) return null;
  const v = el.getAttribute('data-v'), q = x => x.replace(/["\\]/g, '\\$&');
  return '[data-a="' + q(a) + '"]' + (v != null ? '[data-v="' + q(v) + '"]' : '');
}
function pintar() {
  validarSesion();
  const act = document.activeElement, sel = claveFoco(act);
  let rango = null; try { if (act && act.selectionStart != null) rango = [act.selectionStart, act.selectionEnd]; } catch (e) {}
  document.body.classList.toggle('es-admin', !!(sesion && sesion.rol === 'admin'));
  $('raiz').innerHTML = !sesion ? vistaLogin() : sesion.rol === 'admin' ? vistaAdmin() : vistaCliente();
  $('demo-barra').innerHTML = CONFIG.demo ? '<div class="demo-barra gutter" role="note"><span>DEMO · datos ficticios · el acceso y los correos son simulados</span><button type="button" data-a="que-simulado">¿Qué es simulado?</button></div>'
    : REMOTO ? '' : '<div class="demo-barra gutter" role="note"><span>Versión piloto · lo que ingreses queda guardado solo en este dispositivo</span><button type="button" data-a="que-simulado">Más info</button></div>';
  let destino = null;
  if (ui.foco) { destino = document.querySelector(ui.foco.charAt(0) === '[' ? ui.foco : '#' + ui.foco); ui.foco = null; }
  else if (sel) { destino = document.querySelector(sel); if (destino === act) destino = null; }
  if (destino) {
    destino.focus({ preventScroll: false });
    if (rango && destino.setSelectionRange && sel && destino === document.querySelector(sel)) { try { destino.setSelectionRange(rango[0], rango[1]); } catch (e) {} }
  }
}

const dlg = $('dlg');
let dlgAccion = null, dlgVuelta = null;
function dialogo(o) {

function cerrarDialogo() {
  try { dlg.close(); } catch (e) { dlg.removeAttribute('open'); }

dlg.addEventListener('click', ev => {

let tToast = null, deshacer = null;
function toast(t, acc) {

  el.innerHTML = '<span>' + esc(t) + '</span>' + (acc ? '<button type="button" data-toast="1">' + esc(acc.txt) + '</button>' : '');

}

function cerrarSesion(motivo, sinPintar) {

function textoExcel(rut) {
  const m = s.meses[rut], e = s.remutyme[rut];
  /* Evita inyección de fórmulas al pegar en Excel (=, +, -, @ al inicio). */
  const celda = v => { let t = String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' ').trim(); if (/^[=+\-@]/.test(t)) t = "'" + t; return t; };
  const filas = [['RUT empresa', 'Empresa', 'Trabajador', 'Tipo', 'Detalle', 'Comentario', 'Respaldo']].concat(
    m.novedades.map(n => [rutBonito(rut), e.nombre, n.trabajador, n.tipo, detalle(n), n.comentario, n.adjunto ? n.adjunto.nombre : '']));
  return filas.map(f => f.map(celda).join('\t')).join('\n');
}
function copiar(texto) {
  const manual = () => dialogo({ titulo: 'Copia el texto', html: '<p class="sub">Tu navegador no dejó copiar solo. Selecciona todo y cópialo (Ctrl+C o mantener presionado).</p><div class="campo"><label for="dlg-copia">Datos para Excel</label><textarea id="dlg-copia" rows="8" readonly>' + esc(texto) + '</textarea></div>', cancelar: 'Cerrar' });

}

document.addEventListener('click', ev => {

/* ---------- Escritura en formularios ---------- */
document.addEventListener('input', ev => {
  const t = ev.target; if (!t.id || t.type === 'file' || !t.closest('#raiz')) return;
  ui.form[t.id] = t.value;
  if (ui.err && ui.err.campo === t.id) { t.removeAttribute('aria-invalid'); const e = $(t.id + '-err'); if (e) e.remove(); ui.err = null; }
  if (t.id === 'comentario' && $('contador')) $('contador').textContent = t.value.length + '/500';
  if (t.id === 'buscar') { ui.buscar = t.value; pintar(); }
  if (t.id === 'trabajador') { ui.foco = t.value === '__otro' ? 'trab-otro' : null; pintar(); }
});
document.addEventListener('focusout', ev => {
  const t = ev.target; if (!t.id || !t.closest || !t.closest('#raiz')) return;
  if ((t.id === 'rut' || t.id === 'o-rut' || t.dataset.rut) && t.value) { const r = normRut(t.value); if (r && dvValido(r)) { t.value = rutBonito(r); ui.form[t.id] = t.value; } }
  if (t.dataset.monto && t.value) { const n = Number(t.value.replace(/\D/g, '')); if (n) { t.value = n.toLocaleString('es-CL'); ui.form[t.id] = t.value; } }
});
['keydown', 'keyup'].forEach(tipo => document.addEventListener(tipo, ev => {
  if (ev.target && ev.target.id === 'clave' && ev.getModifierState) { const c = $('caps'); if (c) c.hidden = !ev.getModifierState('CapsLock'); }

}));

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'archivo') {
    const f = t.files && t.files[0]; if (!f) return;
    const okTipo = /^image\//.test(f.type) || f.type === 'application/pdf' || /\.(pdf|jpe?g|png|heic|heif|webp)$/i.test(f.name);
    if (!okTipo) { ui.err = { campo: 'archivo', msg: 'Ese archivo no sirve. Sube una foto (JPG, PNG, HEIC) o un PDF.' }; ui.foco = 'archivo'; pintar(); return; }
    if (f.size > CONFIG.maxArchivoMB * 1048576) { ui.err = { campo: 'archivo', msg: 'El archivo pesa ' + fmtNum(f.size / 1048576) + ' MB; el máximo es ' + CONFIG.maxArchivoMB + ' MB. Prueba con una foto más liviana.' }; ui.foco = 'archivo'; pintar(); return; }
    if (!f.size) { ui.err = { campo: 'archivo', msg: 'El archivo está vacío. Vuelve a sacar la foto.' }; ui.foco = 'archivo'; pintar(); return; }
    const mime = f.type || (/\.pdf$/i.test(f.name) ? 'application/pdf' : 'image/*');
    ui.archivo = { nombre: f.name.slice(0, 80), kb: Math.max(1, Math.round(f.size / 1024)), mime, url: /^image\//.test(mime) ? URL.createObjectURL(f) : null, file: f };
    ui.err = null; ui.foco = '[data-a="quitar-archivo"]'; pintar(); return;
  }
  if (t.id === 'masiva-archivo') {
    const a = t.files && t.files[0]; if (!a) return;
    if (a.size > 1048576) { ui.err = { campo: 'masiva', msg: 'El archivo es muy grande para una lista de RUT (máximo 1 MB).' }; pintar(); return; }
    const lector = new FileReader();
    lector.onload = () => { ui.form.masiva = String(lector.result).replace(/^\uFEFF/, '').trim(); ui.carga = null; ui.err = null; ui.foco = 'masiva'; pintar(); toast('Archivo leído: toca «Revisar lista»'); };
    lector.onerror = () => toast('No se pudo leer el archivo.');
    lector.readAsText(a);
  }
});

/* ---------- Envío de formularios ---------- */
function falla(campo, msg) { ui.err = { campo: campo || null, msg }; ui.foco = campo === 'tipo' ? '[data-a="tipo"]' : campo || null; pintar(); if (!campo) { const e = document.querySelector('#raiz .error'); if (e) e.scrollIntoView({ block: 'center' }); } return false; }
function leerCampos(tipo) {
  const def = TIPOS[tipo], datos = {};
  for (const c of def.campos) {
    const id = 'c-' + c.id, v = String(val(id)).trim();
    if (!v) return { campo: id, msg: c.t === 'fecha' ? 'Elige la fecha «' + c.l.toLowerCase() + '».' : c.t === 'opc' ? 'Elige el ' + c.l.toLowerCase() + '.' : 'Falta «' + c.l.toLowerCase() + '».' };
    if (c.t === 'num') {
      const x = Number(v.replace(',', '.'));
      if (!isFinite(x) || x < c.min || x > c.max) return { campo: id, msg: 'Escribe un número entre ' + fmtNum(c.min) + ' y ' + fmtNum(c.max) + '.' };
      if (Math.round(x * 2) !== x * 2) return { campo: id, msg: 'Usa números enteros o medios, por ejemplo 2,5.' };
      datos[c.id] = x;
    } else if (c.t === 'monto') {
      if (/[.,]\d{1,2}$/.test(v) && !/\.\d{3}$/.test(v)) return { campo: id, msg: 'Escribe el monto en pesos, sin decimales.' };
      const x = Number(v.replace(/\D/g, ''));
      if (!x) return { campo: id, msg: 'Escribe el monto en pesos, por ejemplo 50.000.' };
      if (x > 50000000) return { campo: id, msg: 'El monto parece muy alto. Revísalo.' };
      datos[c.id] = x;
    } else if (c.t === 'fecha') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || isNaN(dLocal(v))) return { campo: id, msg: 'Elige una fecha válida.' };
      datos[c.id] = v;
    } else if (c.t === 'rut') {
      const r = normRut(v); if (!r || !dvValido(r)) return { campo: id, msg: 'Revisa el RUT: falta un número o el dígito verificador no calza.' };
      datos[c.id] = r;
    } else if (c.t === 'opc') {
      if (c.ops.indexOf(v) < 0) return { campo: id, msg: 'Elige una opción de la lista.' };
      datos[c.id] = v;
    } else {
      if (v.length < 2) return { campo: id, msg: 'Escribe un poco más.' };
      datos[c.id] = v.slice(0, 200);
    }
  }
  if (datos.desde && datos.hasta) {
    if (datos.hasta < datos.desde) return { campo: 'c-hasta', msg: '«Hasta» no puede ser antes de «Desde».' };
    if (diasEntre(datos.desde, datos.hasta) > 366) return { campo: 'c-hasta', msg: 'El período es de más de un año. Revisa las fechas.' };
  }
  return { datos };
}
const SUB = {
  'f-codigo': async () => {
    if (ui.cargando) return;
    const cod = String(val('a-codigo')).replace(/\D/g, '');
    if (cod.length !== 6) return falla('a-codigo', 'El código tiene 6 números.');
    ui.cargando = true; pintar();
    const r = await api('admin-entrar', { correo: ui.adminCorreo, codigo: cod }); ui.cargando = false;
    if (!r.ok) { ui.err = { campo: r.campo || null, msg: r.error }; ui.foco = 'a-codigo'; pintar(); return; }
    sesion = { rol: 'admin', correo: r.correo, token: r.token, ultimo: Date.now() }; guardarSesion();
    await cargarAdmin();
    entrar(sesion, 'Hola, ' + r.correo.split('@')[0]);
  },
  'f-admin': async () => {
    if (ui.cargando) return;
    const correo = String(val('a-correo')).trim().toLowerCase();
    if (!RE_CORREO.test(correo)) return falla('a-correo', 'Escribe tu correo de Contyme.');
    ui.cargando = true; pintar();

    ui.cargando = false;
    if (!ok) { ui.err = { msg: 'Este correo no tiene acceso de administrador.' }; ui.foco = 'a-correo'; pintar(); return; }

      ui.cargando = true; pintar();

    }
    entrar({ rol: 'admin', correo }, 'Hola, ' + correo.split('@')[0]);

  },
  'f-ingreso': async () => {
    if (ui.cargando) return;
    const rutTxt = val('rut'), clave = val('clave');
    ui.cargando = true; ui.err = null; ui.aviso = ''; pintar();
    let r; try { r = await srv.ingresar(rutTxt, clave); } catch (e) { r = { error: 'No pudimos revisar la clave. Intenta de nuevo.' }; }
    ui.cargando = false;
    if (r.ok) { entrar({ rol: 'cliente', rut: r.rut, token: r.token }, 'Bienvenido, ' + s.remutyme[r.rut].nombre); return; }
    if (r.paso === 'crear') { ui.paso = 'crear'; ui.ticket = r.ticket; ui.crearPara = { rut: r.rut, nombre: r.nombre }; ui.form = {}; ui.foco = 'nueva'; pintar(); return; }
    ui.form.clave = ''; falla(r.campo, r.error);
  },
  'f-crear': async () => {
    if (ui.cargando) return;
    ui.cargando = true; ui.err = null; pintar();
    let r; try { r = await srv.crearClave(ui.ticket, val('nueva'), val('repite'), val('contacto')); } catch (e) { r = { error: 'No pudimos guardar la clave. Intenta de nuevo.' }; }
    ui.cargando = false;
    if (r.ok) { entrar({ rol: 'cliente', rut: r.rut, token: r.token }, 'Clave creada. Bienvenido, ' + s.remutyme[r.rut].nombre); return; }
    if (r.reiniciar) { ui.paso = 'rut'; ui.form = {}; }
    if (r.campo === 'nueva' || r.campo === 'repite') { ui.form.repite = ''; }
    falla(r.campo, r.error);
  },
  'f-olvide': () => {
    const r = srv.pedirRestablecer(val('o-rut'));
    if (r.error) return falla(r.campo, r.error);
    ui.err = null; ui.aviso = 'Listo. Si ese RUT está habilitado, tu encargada recibió el aviso y te contactará. Contyme nunca te pedirá tu clave.'; pintar();
  },
  'f-nov': () => {
    if (!ui.tipo) return falla('tipo', 'Elige qué pasó.');
    const def = TIPOS[ui.tipo], d = srv.cli.datos();
    let trabajador = null;
    if (!def.sinTrabajador) {
      const t = val('trabajador');
      if (!t) return falla('trabajador', 'Elige el trabajador.');
      if (t === '__otro') { trabajador = String(val('trab-otro')).trim().replace(/\s+/g, ' '); if (trabajador.length < 3) return falla('trab-otro', 'Escribe el nombre y apellido del trabajador.'); }
      else if (d.trabajadores.indexOf(t) < 0) return falla('trabajador', 'Elige un trabajador de la lista.');
      else trabajador = t;
    }
    const r = leerCampos(ui.tipo); if (r.campo) return falla(r.campo, r.msg);
    if (def.sinTrabajador) trabajador = r.datos.nombre;
    const a = def.adj && ui.archivo ? { nombre: ui.archivo.nombre, kb: ui.archivo.kb, mime: ui.archivo.mime } : null;
    const repetida = d.mes.novedades.some(x => x.id !== ui.editando && x.trabajador === trabajador && x.tipo === ui.tipo);
    const res = srv.cli.guardarNovedad({ trabajador, tipo: ui.tipo, datos: r.datos, comentario: String(val('comentario')).trim(), adjunto: a }, ui.editando);
    if (res.error) return falla(null, res.error);
    if (a && ui.archivo.url) previas.set(res.id, ui.archivo.url); else if (!a) previas.delete(res.id);
    if (a && ui.archivo.file) archivosMem.set(res.id, ui.archivo.file); else if (!a) archivosMem.delete(res.id);
    const editado = ui.editando != null;
    ir('mes');
    toast(repetida ? 'Guardada. Ojo: ' + trabajador + ' ya tenía otra novedad de ese tipo; revisa que no esté repetida.' : editado ? 'Cambios guardados' : 'Novedad guardada. Falta enviar a Contyme.');
  },
  'f-masiva': () => {
    const texto = val('masiva');
    if (!texto.trim()) return falla('masiva', 'Pega al menos un RUT o sube un CSV.');
    if (texto.split(/\r?\n/).length > 2000) return falla('masiva', 'Son demasiadas líneas. Sube hasta 2.000 empresas por vez.');
    ui.carga = srv.adm.analizarCarga(texto); ui.err = null; ui.foco = null; pintar();
    const btn = document.querySelector('[data-a="aplicar-carga"]') || document.querySelector('[data-a="cancelar-carga"]'); if (btn) btn.focus();
  }
};
